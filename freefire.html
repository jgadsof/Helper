<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instaboost Panel - Cyberpunk Free Fire Terminal</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            overflow-x: hidden;
            background-color: #05050a;
        }

        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                linear-gradient(rgba(5, 5, 10, 0.85), rgba(5, 5, 10, 0.95)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 204, 0.03) 2px, rgba(0, 255, 204, 0.03) 4px),
                url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            z-index: 1;
            pointer-events: none;
        }

        .glow-orb {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: rgba(0, 255, 204, 0.1);
            filter: blur(150px);
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        /* CINEMATIC INTRO OVERLAY */
        .intro-welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #05050a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: hideIntroOverlay 0.4s ease 4.1s forwards;
        }

        @keyframes hideIntroOverlay {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        .intro-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            width: 100%;
            padding: 0 15px;
        }

        .welcome-text-container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .cyber-letter {
            font-size: clamp(16px, 2.4vw, 32px);
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            opacity: 0;
            display: inline-block;
            transform: translateY(var(--ty)) translateX(var(--tx));
            animation: assembleLetter 1.2s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
            animation-delay: var(--delay);
        }

        .space-char { width: clamp(6px, 1vw, 12px); display: inline-block; }

        @keyframes assembleLetter {
            0% { opacity: 0; transform: translateY(var(--ty)) translateX(var(--tx)) scale(0.5); filter: blur(8px); }
            70% { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) translateX(0) scale(1); filter: blur(0); }
        }

        .neon-subtitle-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; max-width: 95%; }
        .neon-char {
            font-size: clamp(12px, 1.5vw, 17px);
            font-weight: bold;
            color: #ff007f;
            letter-spacing: 1px;
            opacity: 0;
            display: inline-block;
            text-shadow: 0 0 5px #ff007f, 0 0 15px #00ffcc;
            animation: neonInsideOutBlinkChar 1.1s ease 1.6s forwards, charFallDown 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19) var(--fall-delay) forwards;
        }
        .space-char-sub { width: 6px; display: inline-block; }

        @keyframes neonInsideOutBlinkChar {
            0% { opacity: 0; transform: scale(0.1); filter: blur(10px) brightness(3); }
            50% { opacity: 1; transform: scale(1.15); filter: blur(1px) brightness(2); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes charFallDown {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(120vh) rotate(35deg) scale(0.5); opacity: 0; filter: blur(8px); }
        }

        /* HEADER & LAYOUT */
        .dash-header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 12, 0.9);
            border-bottom: 1px solid rgba(0, 255, 204, 0.4);
            padding: 20px 40px;
            backdrop-filter: blur(12px);
        }

        .dash-title { font-size: 22px; font-weight: bold; color: #00ffcc; letter-spacing: 2px; margin: 0; }
        .nav-btn {
            background: transparent; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 18px; border-radius: 4px; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #00ffcc; color: #05050a; box-shadow: 0 0 15px #00ffcc; }

        .main-container {
            position: relative; z-index: 10; max-width: 860px; margin: 35px auto; padding: 0 20px; text-align: center;
        }
        .main-container h2 { font-size: 30px; margin-bottom: 10px; color: #ffffff; letter-spacing: 2.5px; opacity: 0; animation: fadeInHeading 0.6s ease 4.1s forwards; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 30px; min-height: 20px; opacity: 0; animation: fadeInHeading 0.6s ease 4.2s forwards; }
        .cursor { display: inline-block; background-color: #00ffcc; width: 8px; height: 14px; margin-left: 3px; animation: blinkCursor 0.8s infinite; vertical-align: middle; }

        @keyframes blinkCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        @keyframes fadeInHeading { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* HUD BOX */
        .ff-card-wrapper {
            position: relative; width: 100%; border-radius: 8px; padding: 3px;
            background: linear-gradient(135deg, #00ffcc, #ff007f);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(0, 255, 204, 0.25);
            margin-bottom: 30px; opacity: 0; transform: scale(0.02) scaleY(0.005);
            animation: boxAssembleGamingFF 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 4.1s forwards;
        }

        @keyframes boxAssembleGamingFF {
            0% { transform: scale(0.02) scaleY(0.005); opacity: 0; filter: brightness(5); }
            50% { transform: scale(1.02) scaleY(0.05); opacity: 0.9; filter: brightness(2.5); }
            100% { transform: scale(1) scaleY(1); opacity: 1; filter: brightness(1); }
        }

        .ff-card-inner { position: relative; z-index: 1; background: #080812; border-radius: 6px; padding: 40px 30px; text-align: center; }
        .ff-branding-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 12px; opacity: 0; transform: translateY(20px); animation: elementReveal 0.8s ease 4.8s forwards; }
        .ff-png-logo { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0, 255, 204, 0.8)); }
        .ff-card-inner h3 { color: #00ffcc; font-size: 20px; margin: 0; letter-spacing: 2px; }
        .ff-card-inner p.dest-desc { color: #94a3b8; font-size: 13px; margin: 10px 0 30px 0; opacity: 0; transform: translateY(20px); animation: elementReveal 0.8s ease 5.0s forwards; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; text-align: left; max-width: 740px; margin: 0 auto; }
        .form-group-full { grid-column: span 2; }
        @keyframes elementReveal { to { opacity: 1; transform: translateY(0); } }

        .cyber-input-box { position: relative; background: rgba(10, 10, 20, 0.95); border-radius: 4px; padding: 16px 14px 12px 14px; opacity: 0; }
        .cyber-input-box label { display: block; font-size: 11px; color: #00ffcc; margin-bottom: 6px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: bold; }
        .box-svg-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        .laser-point { position: absolute; width: 8px; height: 8px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 12px #00ffcc; top: 0; left: 0; z-index: 5; opacity: 0; }
        .box-svg-border rect { fill: none; stroke: #00ffcc; stroke-width: 2; stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        .field-inner-content { opacity: 0; transition: opacity 0.2s ease; }
        
        .cyber-input-box.active { opacity: 1; }
        .cyber-input-box.active .laser-point { opacity: 1; animation: drawBorderPath 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .cyber-input-box.active .box-svg-border rect { animation: drawRectBorder 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .cyber-input-box.active .field-inner-content { opacity: 1; transition-delay: 0.75s; }

        @keyframes drawBorderPath {
            0% { top: 0px; left: 0px; transform: translate(0, 0); }
            25% { top: 0px; left: 100%; transform: translate(-100%, 0); }
            50% { top: 100%; left: 100%; transform: translate(-100%, -100%); }
            75% { top: 100%; left: 0px; transform: translate(0, -100%); }
            100% { top: 0px; left: 0px; transform: translate(0, 0); opacity: 0; }
        }
        @keyframes drawRectBorder { to { stroke-dashoffset: 0; } }

        .cyber-input-box input {
            width: 100%; background: rgba(3, 3, 8, 0.95); border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 3px; padding: 11px 12px; color: #ffffff; font-family: 'Courier New', Courier, monospace;
            font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .error-msg { display: none; color: #ff0055; font-size: 11px; margin-top: 5px; }

        .execute-btn-wrapper { grid-column: span 2; text-align: center; margin-top: 10px; opacity: 0; transform: scale(0.8); }
        .execute-btn-wrapper.active { opacity: 1; transform: scale(1); animation: buttonPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes buttonPop { to { opacity: 1; transform: scale(1); } }

        .execute-btn {
            background: #00ffcc; color: #05050a; border: none; padding: 14px 45px;
            border-radius: 4px; font-size: 14px; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
        }
        .execute-btn:hover { background: #ff007f; color: #ffffff; box-shadow: 0 0 35px #ff007f; transform: translateY(-2px); }

        /* UNIQUE NON-CIRCLE LOADING OVERLAY */
        #custom-loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Matrix Bar / Spectrum Scanner Animation */
        .scanner-container {
            width: 320px;
            height: 6px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .scanner-bar {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, #00ffcc, #ff007f, transparent);
            animation: scanMove 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes scanMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .loading-typewriter-text {
            font-size: 18px;
            color: #00ffcc;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="intro-welcome-overlay">
        <div class="intro-content-wrapper">
            <div class="welcome-text-container" id="welcomeTextContainer"></div>
            <div class="neon-subtitle-container" id="neonSubtitleContainer"></div>
        </div>
    </div>

    <div class="cyber-bg"></div>
    <div class="glow-orb"></div>

    <div class="dash-header">
        <h1 class="dash-title">CYBER TERMINAL // FF</h1>
        <a href="hub.html" class="nav-btn">← BACK TO HUB</a>
    </div>

    <div class="main-container">
        <h2>FREE FIRE NEURAL INTERFACE</h2>
        <p class="subtitle"><span id="typewriter-text"></span><span class="cursor"></span></p>

        <div class="ff-card-wrapper">
            <div class="ff-card-inner">
                <div class="ff-branding-header">
                    <img src="https://images.seeklogourl.com/wp-content/uploads/2021/11/garena-free-fire-logo-vector.png" alt="FF Logo" class="ff-png-logo" onerror="this.src='https://images.seeklogo.com/logo-png/43/2/garena-free-fire-logo-png_seeklogo-439567.png'">
                    <h3>INITIALIZE NEURAL PROTOCOL</h3>
                </div>
                <p class="dest-desc">Configure player parameters below. Each sub-box establishes a secure connection node.</p>

                <form onsubmit="handleFFExecution(event)">
                    <div class="form-grid">
                        <div class="cyber-input-box" id="box-uid">
                            <label for="ff-uid">Player UID (Max 10 Digits)</label>
                            <div class="laser-point"></div>
                            <svg class="box-svg-border" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="98" rx="4" ry="4"/></svg>
                            <div class="field-inner-content">
                                <input type="text" id="ff-uid" required maxlength="10" placeholder="e.g. 1234567890" oninput="validateUID(this)">
                                <div id="uid-warning" class="error-msg">⚠️ Only mathematical digits (Max 10) are allowed!</div>
                            </div>
                        </div>

                        <div class="cyber-input-box" id="box-username">
                            <label for="ff-username">Player Username (Max 16 Chars)</label>
                            <div class="laser-point"></div>
                            <svg class="box-svg-border" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="98" rx="4" ry="4"/></svg>
                            <div class="field-inner-content">
                                <input type="text" id="ff-username" required maxlength="16" placeholder="e.g. Assassin_007!">
                            </div>
                        </div>

                        <div class="cyber-input-box" id="box-region">
                            <label for="ff-region">Server Region</label>
                            <div class="laser-point"></div>
                            <svg class="box-svg-border" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="98" rx="4" ry="4"/></svg>
                            <div class="field-inner-content">
                                <input type="text" id="ff-region" required value="India" readonly style="color: #00ffcc; cursor: not-allowed; background: rgba(0,255,204,0.05);">
                            </div>
                        </div>

                        <div class="cyber-input-box" id="box-level">
                            <label for="ff-level">Player Level (1 - 99)</label>
                            <div class="laser-point"></div>
                            <svg class="box-svg-border" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="98" rx="4" ry="4"/></svg>
                            <div class="field-inner-content">
                                <input type="text" id="ff-level" required maxlength="2" placeholder="e.g. 75" oninput="validateLevel(this)">
                            </div>
                        </div>

                        <div class="cyber-input-box form-group-full" id="box-age">
                            <label for="ff-age">Account Age (1-9 Years)</label>
                            <div class="laser-point"></div>
                            <svg class="box-svg-border" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="98" rx="4" ry="4"/></svg>
                            <div class="field-inner-content">
                                <input type="text" id="ff-age" required maxlength="1" placeholder="e.g. 3" oninput="validateAge(this)">
                            </div>
                        </div>

                        <div class="execute-btn-wrapper" id="executeBtnWrapper">
                            <button type="submit" class="execute-btn">EXECUTE PROTOCOL</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- UNIQUE LOADING OVERLAY -->
    <div id="custom-loading-overlay">
        <div class="scanner-container">
            <div class="scanner-bar"></div>
        </div>
        <div class="loading-typewriter-text" id="loadingTypeText"></div>
    </div>

    <script>
        const message = "WELCOME DEAR PLAYER";
        const container = document.getElementById("welcomeTextContainer");
        message.split("").forEach((char, index) => {
            if (char === " ") {
                const spaceSpan = document.createElement("span");
                spaceSpan.className = "space-char";
                container.appendChild(spaceSpan);
            } else {
                const span = document.createElement("span");
                span.className = "cyber-letter";
                span.textContent = char;
                span.style.setProperty('--ty', `${(index % 2 === 0 ? -1 : 1) * (60 + index * 10)}px`);
                span.style.setProperty('--tx', `${(index % 3 === 0 ? -1 : 1) * (30 + index * 4)}px`);
                span.style.setProperty('--delay', `${0.1 + index * 0.04}s`);
                container.appendChild(span);
            }
        });

        const neonSubtitleText = "Welcome to the world of Free Fire";
        const neonContainer = document.getElementById("neonSubtitleContainer");
        neonSubtitleText.split("").forEach((char, index) => {
            if (char === " ") {
                const spaceSpan = document.createElement("span");
                spaceSpan.className = "space-char-sub";
                neonContainer.appendChild(spaceSpan);
            } else {
                const charSpan = document.createElement("span");
                charSpan.className = "neon-char";
                charSpan.textContent = char;
                charSpan.style.setProperty('--fall-delay', `${3.1 + index * 0.03}s`);
                neonContainer.appendChild(charSpan);
            }
        });

        const textToType = "Deploying secure neural nodes and parameter verification.";
        let charIndex = 0;
        function typeWriter() {
            if (charIndex < textToType.length) {
                document.getElementById("typewriter-text").textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            }
        }

        function startSequentialBoxAnimations() {
            const boxes = [
                document.getElementById('box-uid'),
                document.getElementById('box-username'),
                document.getElementById('box-region'),
                document.getElementById('box-level'),
                document.getElementById('box-age')
            ];
            boxes.forEach((box, index) => {
                setTimeout(() => { box.classList.add('active'); }, index * 800);
            });
            setTimeout(() => {
                document.getElementById('executeBtnWrapper').classList.add('active');
            }, boxes.length * 800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 4100);
            setTimeout(startSequentialBoxAnimations, 5300);
        });

        function validateUID(input) {
            const warning = document.getElementById('uid-warning');
            const hasNonDigit = /[^0-9]/.test(input.value);
            input.value = input.value.replace(/[^0-9]/g, '');
            warning.style.display = (hasNonDigit || input.value.length > 10) ? 'block' : 'none';
        }

        function validateLevel(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            let val = parseInt(input.value);
            if (val > 99) input.value = "99";
            if (val === 0 && input.value.length > 0) input.value = "1";
        }

        function validateAge(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if (parseInt(input.value) === 0) input.value = "1";
        }

        // EXECUTE BUTTON & WORD-BY-WORD ANIMATED LOADING LOGIC
        function handleFFExecution(event) {
            event.preventDefault();
            
            const loadingOverlay = document.getElementById('custom-loading-overlay');
            const loadingTextContainer = document.getElementById('loadingTypeText');
            loadingOverlay.style.display = 'flex';

            const verificationSentence = "Details are being verified...";
            let lIndex = 0;
            loadingTextContainer.textContent = "";

            // Word by word or letter by letter typing effect during the 3 seconds loading
            function typeLoadingText() {
                if (lIndex < verificationSentence.length) {
                    loadingTextContainer.textContent += verificationSentence.charAt(lIndex);
                    lIndex++;
                    setTimeout(typeLoadingText, 80);
                }
            }
            typeLoadingText();

            // Total 3 seconds loading + 2 seconds buffer, then redirect to success page
            setTimeout(() => {
                window.location.href = "success.html";
            }, 5000);
        }
    </script>
</body>
</html>
