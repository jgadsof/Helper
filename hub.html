<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaHelper // Select Help Protocol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #05050a;
            --panel-bg: rgba(8, 8, 15, 0.82);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 6px 100%;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
            to { text-shadow: 0 0 25px rgba(0, 243, 255, 0.9), 0 0 5px #fff; }
        }

        .subtitle {
            color: #ff0055;
            font-size: 1.1rem;
            margin-bottom: 50px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* --- BASE CARD STYLING WITH BACKGROUND WALLPAPERS --- */
        .choice-card {
            background-color: var(--panel-bg);
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            padding: 40px 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* Dark overlay to keep text readable over wallpapers */
        .choice-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(5, 5, 10, 0.85), rgba(5, 5, 10, 0.95));
            z-index: 1;
            transition: 0.4s;
        }

        .choice-card > * {
            position: relative;
            z-index: 2;
        }

        .choice-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #fff;
            transition: 0.3s;
        }

        .choice-card p {
            color: #a0a0c2;
            font-size: 0.95rem;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .select-btn {
            background: transparent;
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* --- 1. FREE FIRE CARD --- */
        .card-freefire {
            background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop');
        }
        .card-freefire:hover {
            border-color: #ff3c00;
            box-shadow: 0 0 35px rgba(255, 60, 0, 0.6), inset 0 0 20px rgba(255, 140, 0, 0.4);
            transform: translateY(-10px) scale(1.03);
        }
        .card-freefire:hover::before {
            background: linear-gradient(to bottom, rgba(30, 5, 0, 0.75), rgba(10, 2, 0, 0.9));
        }
        .card-freefire:hover h2 {
            color: #ffa500;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.9);
        }
        .card-freefire .select-btn {
            border: 1px solid #ff8c00;
            color: #ffa500;
        }
        .card-freefire:hover .select-btn {
            background: linear-gradient(135deg, #ff3c00, #ff8c00);
            color: #000;
            font-weight: 900;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.9);
        }

        /* --- 2. PUBG MOBILE CARD (Linked to pubg.html) --- */
        .card-pubg {
            background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1000&auto=format&fit=crop');
        }
        .card-pubg:hover {
            border-color: #f4c430;
            box-shadow: 0 0 30px rgba(244, 196, 48, 0.5), inset 0 0 20px rgba(128, 128, 0, 0.4);
            transform: translateY(-10px) scale(1.03);
        }
        .card-pubg:hover::before {
            background: linear-gradient(to bottom, rgba(20, 18, 5, 0.75), rgba(5, 5, 2, 0.9));
        }
        .card-pubg:hover h2 {
            color: #f4c430;
            text-shadow: 0 0 12px rgba(244, 196, 48, 0.9);
        }
        .card-pubg .select-btn {
            border: 1px solid #d4af37;
            color: #f4c430;
        }
        .card-pubg:hover .select-btn {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #05050a;
            font-weight: 900;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* --- 3. INSTAGRAM CARD --- */
        .card-instagram {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop');
        }
        .card-instagram:hover {
            border-color: #fd1d1d;
            box-shadow: 0 0 30px rgba(253, 29, 29, 0.5), inset 0 0 20px rgba(131, 58, 180, 0.4);
            transform: translateY(-10px) scale(1.03);
        }
        .card-instagram:hover::before {
            background: linear-gradient(to bottom, rgba(15, 5, 20, 0.75), rgba(5, 2, 10, 0.9));
        }
        .card-instagram:hover h2 {
            color: #f56040;
            text-shadow: 0 0 12px rgba(245, 96, 64, 0.9);
        }
        .card-instagram .select-btn {
            border: 1px solid #c13584;
            color: #fd1d1d;
        }
        .card-instagram:hover .select-btn {
            background: linear-gradient(45deg, #405de6, #833ab4, #fd1d1d, #fcb045);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.8);
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="container">
        <h1>ACCESS CONTROL NEXUS</h1>
        <div class="subtitle">> SELECT GAME OR PLATFORM PROTOCOL</div>

        <div class="choices-grid">
            <!-- Free Fire Card -->
            <div class="choice-card card-freefire" onclick="redirectTo('freefire.html')">
                <h2>FREE FIRE</h2>
                <p>Diamond Injector, Elite Pass, Rank Push & Profile Likes Protocol.</p>
                <button class="select-btn">Initialize FF</button>
            </div>

            <!-- PUBG Mobile Card (Ab ye seedha pubg.html kholega) -->
            <div class="choice-card card-pubg" onclick="redirectTo('pubg.html')">
                <h2>PUBG MOBILE</h2>
                <p>UC Injector, Royale Pass & Conqueror Rank Tools.</p>
                <button class="select-btn">Initialize PUBG</button>
            </div>

            <!-- Instagram Card -->
            <div class="choice-card card-instagram" onclick="redirectTo('dashboard.html')">
                <h2>INSTAGRAM</h2>
                <p>Followers, Likes, Views & Engagement Control Panel.</p>
                <button class="select-btn">Initialize Insta</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(frequency, type, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.value = frequency;

            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        document.querySelectorAll('.choice-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                playBeep(520, 'sine', 0.06);
            });
        });

        function redirectTo(pageUrl) {
            playBeep(880, 'square', 0.12);
            
            setTimeout(() => {
                window.location.href = pageUrl;
            }, 200);
        }
    </script>
</body>
</html>
